apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-api
  namespace: weather-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weather-api
  template:
    metadata:
      labels:
        app: weather-api
    spec:
      imagePullSecrets:
        - name: ecr-pull
      containers:
        - name: weather-api
          image: 796397492592.dkr.ecr.us-east-1.amazonaws.com/weather-api:1.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: weather-lab
spec:
  selector:
    app: weather-api
  ports:
    - name: http
      port: 5000
      targetPort: http
