apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-nginx
  namespace: weather-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weather-nginx
  template:
    metadata:
      labels:
        app: weather-nginx
    spec:
      imagePullSecrets:
        - name: ecr-pull
      containers:
        - name: nginx
          image: 796397492592.dkr.ecr.us-east-1.amazonaws.com/weather-nginx:1.4
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: weather-nginx
  namespace: weather-lab
spec:
  type: NodePort
  selector:
    app: weather-nginx
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
